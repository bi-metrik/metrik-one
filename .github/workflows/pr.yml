# Verificacion de todo PR. Es el gate que permite mergear sin que Mauricio revise
# a mano: si esto pasa, el merge no depende de criterio humano.
#
# Por que no estaba: el repo tenia un solo workflow (migraciones.yml) que solo
# corre cuando el PR toca supabase/migrations/. Todo lo demas entraba a main sin
# que nada lo ejecutara, y asi paso inadvertido que un archivo de pruebas ni
# siquiera colectaba.
#
# `next build` corre SIN variables de entorno a proposito: se verifico que pasa
# limpio sin `.env.local`. Si algun dia el build empieza a exigir una variable,
# preferimos enterarnos aqui y no en el deploy.
name: PR

on:
  pull_request:

# Un PR que recibe varios push seguidos solo verifica el ultimo.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tipos-y-pruebas:
    name: Tipos y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Pruebas
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Build de produccion
        run: npx next build

  lint:
    name: Lint de lo que cambia
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Se compara contra la base del PR: hace falta mas de un commit.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # Deliberadamente NO se corre eslint sobre todo el repo: main arrastra
      # deuda vieja y un check que nace rojo entrena a ignorarlo. Esto es un
      # trinquete: lo que el PR ESCRIBE entra limpio, y la deuda vieja se paga
      # aparte. Antes revisaba el archivo completo, y eso castigaba tocar un
      # archivo sucio aunque el cambio fuera de una linea (paso en el #336).
      - name: Lint de las lineas del PR
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          # Sin --depth: el checkout ya trajo la historia completa y un fetch
          # superficial la RECORTA, dejando la base sin ancestro comun con la
          # rama en cuanto main avanza. El sintoma es "no merge base", que se
          # lee como un problema del PR y es del propio check.
          git fetch origin "${{ github.base_ref }}" --quiet
          node scripts/lint-lineas-cambiadas.mjs "$BASE_REF"
