# Verificacion de todo PR. Es el gate que permite mergear sin que Mauricio revise
# a mano: si esto pasa, el merge no depende de criterio humano.
#
# Por que no estaba: el repo tenia un solo workflow (migraciones.yml) que solo
# corre cuando el PR toca supabase/migrations/. Todo lo demas entraba a main sin
# que nada lo ejecutara, y asi paso inadvertido que un archivo de pruebas ni
# siquiera colectaba.
#
# `next build` corre SIN variables de entorno a proposito: se verifico que pasa
# limpio sin `.env.local`. Si algun dia el build empieza a exigir una variable,
# preferimos enterarnos aqui y no en el deploy.
name: PR

on:
  pull_request:

# Un PR que recibe varios push seguidos solo verifica el ultimo.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tipos-y-pruebas:
    name: Tipos y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Pruebas
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Build de produccion
        run: npx next build

  edge-functions:
    name: Tipos de edge functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # `supabase/functions/` corre en Deno, no en Next: el `tsc` del job de
      # arriba lo EXCLUYE por tsconfig, asi que hasta ahora las edge functions
      # se desplegaban sin ningun chequeo de tipos. Ya dejo pasar dos
      # regresiones completas (el `negocio.etapa_actual_id` del #377, y el
      # `amount: number | null` que este PR arregla), y las dos se detectaron
      # a mano semanas despues.
      #
      # `--node-modules-dir=none` NO es cosmetico: sin el, Deno ve el
      # `node_modules/` del repo (que es de npm, para Next) y cambia a
      # resolucion por node-modules, con lo que `notificar-etapa` falla al
      # resolver su `jsr:@supabase/supabase-js@2`. En CI no hay node_modules en
      # este job, asi que sin el flag el check pasaria aqui y fallaria en la
      # maquina de quien corra `npm ci` — un check que solo falla en local es
      # peor que no tenerlo. Con el flag, ambos resuelven como Deno Deploy.
      #
      # Se chequean los 53 .ts, no solo los `*/index.ts`: asi entran tambien
      # los modulos de `_shared/` que ningun entry point importe todavia.
      #
      # `find` y no un glob `**`: bash NO trae `globstar` activo por defecto, y
      # sin el `**` se comporta como `*`. Medido en este repo: el glob cubre
      # 26 de 53 archivos y deja fuera todo lo anidado dos niveles
      # (`handlers/registro/`, `cardumen/`, `venezuela/`, `customer/`), incluido
      # `handlers/registro/gasto.ts`, que es el consumidor de `fields.amount`.
      # Un check que aparenta cubrir todo y cubre la mitad es peor que ninguno.
      #
      # Nace VERDE: el arbol quedo limpio en este mismo PR antes de agregar el
      # job, y se lo vio FALLAR reintroduciendo el bug exacto que arregla.
      # Un check que nace rojo entrena a ignorarlo.
      - name: deno check
        # `-not -name '*.test.ts'`: las pruebas de los modulos puros de esta
        # carpeta corren en vitest (node), no en Deno Deploy, asi que importan
        # `vitest` por npm y no llevan la extension `.ts` en sus imports. Deno
        # no puede resolver ninguna de las dos cosas y falla con TS2307. No se
        # pierde cobertura: lo que este check protege es lo que se DESPLIEGA, y
        # un `.test.ts` no se despliega. Quien las verifica es `npm test`.
        run: find supabase/functions -name '*.ts' -not -name '*.test.ts' -print0 | xargs -0 deno check --node-modules-dir=none

  lint:
    name: Lint de lo que cambia
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Se compara contra la base del PR: hace falta mas de un commit.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # Deliberadamente NO se corre eslint sobre todo el repo: main arrastra
      # deuda vieja y un check que nace rojo entrena a ignorarlo. Esto es un
      # trinquete: lo que el PR ESCRIBE entra limpio, y la deuda vieja se paga
      # aparte. Antes revisaba el archivo completo, y eso castigaba tocar un
      # archivo sucio aunque el cambio fuera de una linea (paso en el #336).
      - name: Lint de las lineas del PR
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          # Sin --depth: el checkout ya trajo la historia completa y un fetch
          # superficial la RECORTA, dejando la base sin ancestro comun con la
          # rama en cuanto main avanza. El sintoma es "no merge base", que se
          # lee como un problema del PR y es del propio check.
          git fetch origin "${{ github.base_ref }}" --quiet
          node scripts/lint-lineas-cambiadas.mjs "$BASE_REF"
